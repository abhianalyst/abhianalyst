<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Bank MIS reconciliation workflow</title>
<desc id="desc">Workflow diagram showing Excel inputs, validation and standardization, reconciliation and exception detection, Excel reporting, and Power BI dashboard analysis.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F97316"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#F59E0B" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<text x="60" y="62" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="28" font-weight="700">BANK MIS RECONCILIATION PIPELINE</text>
<text x="60" y="94" fill="#94A3B8" font-family="Arial,sans-serif" font-size="16">Documented project workflow · Python + Excel + Power BI</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g><rect x="55" y="160" width="190" height="145" rx="16" fill="#172235" stroke="#64748B"/><rect x="55" y="160" width="190" height="5" rx="2" fill="url(#orange)"/><text x="150" y="207" fill="#FBBF24" font-size="17" font-weight="700">01 · INPUT</text><text x="150" y="242" fill="#F8FAFC" font-size="20" font-weight="700">Excel files</text><text x="150" y="272" fill="#94A3B8" font-size="14">Bank MIS + internal MIS</text></g>
 <g><rect x="290" y="160" width="190" height="145" rx="16" fill="#172235" stroke="#64748B"/><rect x="290" y="160" width="190" height="5" rx="2" fill="url(#orange)"/><text x="385" y="207" fill="#FBBF24" font-size="17" font-weight="700">02 · PREPARE</text><text x="385" y="242" fill="#F8FAFC" font-size="20" font-weight="700">Validate</text><text x="385" y="272" fill="#94A3B8" font-size="14">Clean + standardize</text></g>
 <g><rect x="525" y="160" width="190" height="145" rx="16" fill="#172235" stroke="#64748B"/><rect x="525" y="160" width="190" height="5" rx="2" fill="url(#orange)"/><text x="620" y="207" fill="#FBBF24" font-size="17" font-weight="700">03 · RECONCILE</text><text x="620" y="242" fill="#F8FAFC" font-size="20" font-weight="700">Match records</text><text x="620" y="272" fill="#94A3B8" font-size="14">Detect exceptions</text></g>
 <g><rect x="760" y="160" width="170" height="145" rx="16" fill="#172235" stroke="#64748B"/><rect x="760" y="160" width="170" height="5" rx="2" fill="url(#orange)"/><text x="845" y="207" fill="#FBBF24" font-size="17" font-weight="700">04 · REPORT</text><text x="845" y="242" fill="#F8FAFC" font-size="20" font-weight="700">Excel outputs</text><text x="845" y="272" fill="#94A3B8" font-size="14">MIS + exception reports</text></g>
 <g><rect x="975" y="160" width="170" height="145" rx="16" fill="#172235" stroke="#64748B"/><rect x="975" y="160" width="170" height="5" rx="2" fill="url(#orange)"/><text x="1060" y="207" fill="#FBBF24" font-size="17" font-weight="700">05 · ANALYZE</text><text x="1060" y="242" fill="#F8FAFC" font-size="20" font-weight="700">Power BI</text><text x="1060" y="272" fill="#94A3B8" font-size="14">KPIs + performance</text></g>
</g>
<g stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M248 232H282"/><path d="M483 232H517"/><path d="M718 232H752"/><path d="M933 232H967"/></g>
<text x="600" y="370" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Designed for repeatable daily processing, reconciliation checks and management reporting</text>
